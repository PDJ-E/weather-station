name: Pico 2 provisioning tests

on:
  push:
    branches:
      - main
    paths:
      - 'tools/picoctl.py'
      - 'tests/test_picoctl.py'
      - 'firmware/pico/**'
      - 'requirements.txt'
      - '.github/workflows/picoctl-tests.yml'
  pull_request:
    paths:
      - 'tools/picoctl.py'
      - 'tests/test_picoctl.py'
      - 'firmware/pico/**'
      - 'requirements.txt'
      - '.github/workflows/picoctl-tests.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned host tools
        run: python -m pip install pyserial==3.5 mpremote==1.29.0 mpy-cross==1.29.0.post2
      - name: Compile Pico firmware with mpy-cross (syntax check)
        run: |
          for f in firmware/pico/*.py firmware/pico/profiles/*/main.py; do
            python -m mpy_cross -o /tmp/check.mpy "$f"
          done
      - name: Execute provisioning tests
        run: python -m unittest discover -s tests -p 'test_picoctl.py' -v
